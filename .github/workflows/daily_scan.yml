name: US Small-Cap Engine - Daily Run (after NY close)

on:
  schedule:
    # 21:30 UTC hafta içi = New York kapanışından sonra (yaz saatinde 17:30, kışın 16:30 NY).
    # Ayın ilk seansında aylık tarama otomatik yapılır.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      yeniden_tara:
        description: 'Bu ayın hisse taramasını şimdi yeniden yap (bekleyen alımlar iptal edilip yeniden seçilir)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: us-engine-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests yfinance
      - name: Run engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          BOQ_RESCAN: ${{ github.event.inputs.yeniden_tara || 'false' }}
        run: python main.py
      - name: Commit data
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot AI"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "🦅 US daily run"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

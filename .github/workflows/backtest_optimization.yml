name: US Small-Cap Engine - Walk Forward Backtest

on:
  workflow_dispatch:
  schedule:
    # Her ayın 2'si 06:40 UTC: model tüm küçük hisse verisiyle yeniden eğitilir (ilk kurulumda elle bir kez çalıştırın)
    - cron: '40 6 2 * *'

permissions:
  contents: write

concurrency:
  group: us-engine-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests yfinance
      - name: Walk-forward backtest (real data only)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python backtest_optimizer.py --start-date 2010-01-01
      - name: Commit research prior, report and caches
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot AI"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "📚 US research prior + walk-forward report"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

name: ABD araştırma verisi dışa aktar (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy scipy requests yfinance
      - name: Export
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python diag_export.py
      - name: Push to diag-data branch (main is not touched)
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot AI"
          git checkout --orphan diag-data
          git rm -r -q -f --cached .
          git add -f diag_out/
          git commit -q -m "teşhis verisi"
          git push -f origin diag-data
